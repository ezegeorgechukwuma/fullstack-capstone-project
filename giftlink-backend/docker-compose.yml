version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"

  backend:
    build: .
    container_name: giftapp-backend
    ports:
      - "3060:3060"
    environment:
      - MONGO_URL=mongodb://mongo:27017/giftlink
    depends_on:
      - mongo
